name: Build and Release SysAP Addon ZIP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Compile & Bundle Addon
        run: npx @vercel/ncc build src/index.ts -o dist --minify

      - name: Extract Version & Prepare Packaging
        id: get_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${PKG_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          ZIP_NAME="somfy-freeathome-addon-${TAG_NAME}.zip"
          echo "Setting execution permissions for SysAP container compliance..."
          chmod -R 755 dist free-at-home-metadata.json manifest.json package.json README.md
          echo "Packaging ${ZIP_NAME} for release ${TAG_NAME}..."
          zip -j "${ZIP_NAME}" free-at-home-metadata.json manifest.json package.json README.md
          zip -r "${ZIP_NAME}" dist
          echo "PACKAGE_ZIP=${ZIP_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somfy-freeathome-addon-zip
          path: ${{ env.PACKAGE_ZIP }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
        run: |
          echo "Publishing release for ${TAG_NAME} with ${PACKAGE_ZIP}..."
          RELEASE_TITLE="Somfy Addon Release ${TAG_NAME}"
          RELEASE_BODY="Automatisches Release-Paket für Busch-Jaeger free@home System Access Point 2.0 / 3.0."

          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists. Uploading zip asset..."
            gh release upload "${TAG_NAME}" "${PACKAGE_ZIP}" --clobber
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" "${PACKAGE_ZIP}" --title "${RELEASE_TITLE}" --notes "${RELEASE_BODY}"
          fi
