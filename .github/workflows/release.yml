name: Build and Release SysAP Addon ZIP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Create Production Dependencies
        run: npm prune --production

      - name: Package Addon ZIP
        run: |
          REF_NAME=${GITHUB_REF_NAME:-latest}
          SAFE_REF=$(echo "$REF_NAME" | tr '/' '-')
          ZIP_NAME="somfy-freeathome-addon-${SAFE_REF}.zip"
          echo "Packaging ${ZIP_NAME}..."
          zip -r "${ZIP_NAME}" dist free-at-home-metadata.json package.json README.md node_modules
          echo "PACKAGE_ZIP=${ZIP_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${SAFE_REF}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somfy-freeathome-addon-zip
          path: ${{ env.PACKAGE_ZIP }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build (Auto-Update)' }}
          files: ${{ env.PACKAGE_ZIP }}
          body: |
            ## Somfy Connectivity Kit (1870755) free@home SysAP 2 Addon
            Automatisches Release-Paket für Busch-Jaeger free@home System Access Point 2.0 / 3.0.
            
            ### Enthaltene Funktionen:
            - Anbindung von Somfy Rollläden, Fenstern und Markisen via Connectivity Kit 1870755.
            - Automatische Registrierung virtueller Aktoren im free@home System Access Point.
            - Integrierte Web-Konfigurations-Oberfläche.
            - Automatischer Build & Update bei jedem Commit auf Main.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

