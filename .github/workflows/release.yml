name: Build and Release SysAP Addon ZIP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Compile & Bundle Addon
        run: npx @vercel/ncc build src/index.ts -o dist --target es2018 --minify

      - name: Extract Version & Prepare Packaging
        id: get_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${PKG_VERSION}.${GITHUB_RUN_NUMBER}"
          fi
          ZIP_NAME="somfy-freeathome-addon-${TAG_NAME}.zip"
          CLEAN_ZIP="somfy-freeathome-addon.zip"
          TAR_NAME="somfy-freeathome-addon-${TAG_NAME}.tar.gz"
          CLEAN_TAR="somfy-freeathome-addon.tar.gz"
          echo "Setting execution permissions for SysAP container compliance..."
          chmod -R 755 dist free-at-home-metadata.json package.json README.md
          echo "Packaging ZIP and TAR.GZ for release ${TAG_NAME}..."
          zip -r "${ZIP_NAME}" free-at-home-metadata.json package.json README.md dist
          cp "${ZIP_NAME}" "${CLEAN_ZIP}"

          tar -czf "${TAR_NAME}" free-at-home-metadata.json package.json README.md dist
          cp "${TAR_NAME}" "${CLEAN_TAR}"

          echo "PACKAGE_ZIP=${ZIP_NAME}" >> $GITHUB_ENV
          echo "CLEAN_ZIP=${CLEAN_ZIP}" >> $GITHUB_ENV
          echo "PACKAGE_TAR=${TAR_NAME}" >> $GITHUB_ENV
          echo "CLEAN_TAR=${CLEAN_TAR}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somfy-freeathome-addon-assets
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.CLEAN_ZIP }}
            ${{ env.PACKAGE_TAR }}
            ${{ env.CLEAN_TAR }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
          CLEAN_ZIP: ${{ env.CLEAN_ZIP }}
          PACKAGE_TAR: ${{ env.PACKAGE_TAR }}
          CLEAN_TAR: ${{ env.CLEAN_TAR }}
        run: |
          echo "Publishing release for ${TAG_NAME} with ZIP and TAR.GZ assets..."
          RELEASE_TITLE="Somfy Addon Release ${TAG_NAME}"
          RELEASE_BODY="Automatisches Release-Paket für Busch-Jaeger free@home System Access Point 2.0 / 3.0 (enthält .tar.gz und .zip)."

          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            echo "Release ${TAG_NAME} exists. Uploading assets..."
            gh release upload "${TAG_NAME}" "${PACKAGE_ZIP}" "${CLEAN_ZIP}" "${PACKAGE_TAR}" "${CLEAN_TAR}" --clobber
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" "${PACKAGE_ZIP}" "${CLEAN_ZIP}" "${PACKAGE_TAR}" "${CLEAN_TAR}" --title "${RELEASE_TITLE}" --notes "${RELEASE_BODY}"
          fi
