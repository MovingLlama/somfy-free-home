name: Build and Release SysAP Addon ZIP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Compile & Bundle Addon
        run: npx @vercel/ncc build src/index.ts -o dist --minify

      - name: Extract Version & Prepare Packaging
        id: get_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${PKG_VERSION}"
          fi
          ZIP_NAME="somfy-freeathome-addon-${TAG_NAME}.zip"
          echo "Packaging ${ZIP_NAME} for version ${PKG_VERSION}..."
          zip -j "${ZIP_NAME}" free-at-home-metadata.json package.json README.md
          zip -r "${ZIP_NAME}" dist
          echo "PACKAGE_ZIP=${ZIP_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somfy-freeathome-addon-zip
          path: ${{ env.PACKAGE_ZIP }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: Somfy Addon Release ${{ steps.get_version.outputs.TAG_NAME }}
          files: ${{ env.PACKAGE_ZIP }}
          body: |
            ## Somfy Connectivity Kit (1870755) free@home SysAP 2 Addon (${{ steps.get_version.outputs.TAG_NAME }})
            Automatisches Release-Paket für Busch-Jaeger free@home System Access Point 2.0 / 3.0.
            
            ### Enthaltene Funktionen:
            - Anbindung von Somfy Rollläden, Fenstern und Markisen via Connectivity Kit 1870755.
            - Automatische Registrierung virtueller Aktoren im free@home System Access Point.
            - Integrierte Web-Konfigurations-Oberfläche.
            - Semantische Release-Versionierung.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

